# /usr/local/etc/umm/agent.yaml — umm-agent configuration (no secrets here).
server: https://umm.example.com
name: "studio-01"
# Written by `umm-agent enrol`; mode 0600, owned by _umm.
credential_file: /usr/local/etc/umm/credential
work_dir: /usr/local/var/umm/work
max_tasks: 1
# Hard cap when an admin sets max_tasks on the router (default 8).
# max_tasks_limit: 8
labels:
  chip: m2-pro

# The allowlist. A task names a runtime and can only append arguments; it can
# never choose the executable. Prefer specific scripts over bare interpreters
# (allowing "python3" alone would let a task run any Python code).
runtimes:
  ffmpeg: ["/opt/homebrew/bin/ffmpeg"]
  ocr: ["/usr/bin/python3", "/opt/ocr/run.py"]

# Extra environment for every task.
task_env: {}

heartbeat_interval: 5s
# How often the agent re-checks that each runtime's program exists and is
# executable by _umm (also at startup and on SIGHUP). Runtimes that fail are
# not offered to the router, so no task is placed here for them.
preflight_interval: 1m
poll_wait: 25s
stop_grace: 10s

# adaptive:   utility while nobody is using the Mac (no console user, screen
#             locked, or idle for priority_idle), background while someone
#             is. A running task is demoted/promoted in place, not stopped.
# background: taskpolicy -b (lowest CPU/IO priority; on Apple Silicon this
#             also keeps CPU work on efficiency cores)
# utility:    taskpolicy -c utility + nice 10 (faster, still polite)
# none:       no wrapper (testing only)
priority: adaptive
priority_idle: 5m

# Task isolation (docs/design.md "Task isolation"). sandbox-exec is no
# longer supported; an old "sandbox: true" is ignored with a warning.
#
# A hidden APFS volume for work_dir, created by the root side (installers and
# the updater): quota "auto" = disk size minus min_free_disk, or e.g. 400g.
work_volume:
  enabled: true
  name: umm-work
  quota: auto
# Kept free for the Mac's user (the larger of the two). Below it the Mac takes
# no work and stops running tasks; tasks are placed by this free work space.
min_free_disk:
  min: 50GiB
  percent: 15
# deny: tasks (and the agent, as the same user) may only reach the router and
# these hosts/CIDRs (TCP/UDP, pf anchor loaded by root). Default allow.
task_network: allow
task_network_allow: []
# The Mac refuses work while any home folder here is readable by _umm.
home_check:
  root: /Users
  ignore: [Shared]

# While this file exists the Mac takes no work and stops running tasks.
pause_file: /usr/local/etc/umm/paused

# console: only the console user's processes count as "user load".
# all:     every process that is not ours counts.
user_load_scope: console

# "Don't disturb the user" policy. A logged-in user alone never stops work.
yield:
  user_cpu_high: 50       # user's own CPU (% of machine, ours excluded) that is "heavy"
  user_cpu_low: 25        # below this the user is calm again
  sustain_seconds: 10     # heavy for this long -> stop our tasks, router reassigns them
  cooldown_seconds: 120   # calm for this long -> accept work again
  memory_pressure: warn   # warn | critical (critical always yields immediately)
  thermal: serious        # fair | serious | critical (critical always yields immediately)
  yield_on_battery: true

max_log_bytes: 1048576

# Live progress. Tasks can always print "UMM_PROGRESS=<0-100>" or write a
# number to $UMM_PROGRESS_FILE. Per runtime, the agent can also read a tool's
# own output: auto (default: the ffmpeg parser when the executable is
# ffmpeg), ffmpeg or none.
progress_parsers:
  ffmpeg: auto

# Inputs are downloaded in parallel byte ranges and outputs uploaded in
# parallel parts of this size (MiB, at least 5).
transfer:
  part_size_mb: 8
  concurrency: 4

# Self-update, done by the root updater (`umm-agent update`, its own
# LaunchDaemon). The router decides the version; releases must carry a valid
# minisign signature from the key built into the agent.
update:
  enabled: true           # false: never replace the binary
  source: auto            # auto (router relay, else direct) | router | direct
  # release_url: https://github.com/alee-ibrahim/use-my-mac/releases/download
  # public_key: "RW..."   # only for forks that sign their own releases
  verify_timeout: 2m      # new agent must heartbeat within this, else rollback

# Managed runtimes: signed packages (e.g. ffmpeg) from the router's catalog
# (`umm runtimes`), installed by the agent itself into `dir` when a task needs
# one or the package is marked for pre-install. No Homebrew, no sudo. A
# package is installed only if its signature verifies with one of
# `public_keys` and its name is in `allow`.
managed_runtimes:
  enabled: true
  # Installed by the root helper (umm-agent runtimes-sync), root-owned and
  # read-only for the agent; the agent only asks through request_file.
  # dir: /usr/local/var/umm-runtimes                  # must not be inside /usr/local/var/umm
  # request_file: /usr/local/var/umm/runtime-requests.json
  # in_use_file: /usr/local/var/umm/runtime-in-use.json
  request_timeout: 15m    # a request not installed by then counts as failed
  allow: ["*"]            # package names this Mac may install
  # public_keys: ["RW..."] # default: the release key (update.public_key, else built in)
  retry_after: 10m        # wait after a failed install before trying again

# mise toolchains (docs/usage.md "Toolchains with mise"): tasks with runtime
# "mise" bring a mise.toml and mise.lock; this Mac's mise installs those tools
# into the task's work dir and runs a program they provide. Off by default:
# such a task picks its tools (from any mise backend) and runs their programs.
mise:
  enabled: false
  binary: /usr/local/bin/mise   # verify it against the release checksums; tested with mise 2026.11.9
  # commands: [node, ffmpeg]    # optional: the only programs tasks may run
  require_lockfile: true        # locked installs; only checksummed downloads are shared
  # cache_dir: /usr/local/var/umm/mise-cache
  max_cache: 2GiB
  # For tools released from private GitHub repositories (at most one; the token
  # reaches `mise install` only, but tasks run as _umm and could read the file):
  # github_token_file: /usr/local/etc/umm/github-token   # mode 0600, owned by _umm
  # github_token_command: ["/usr/local/bin/your-secrets-cli", "kv", "get", "-field=token", "secret/github-read"]
