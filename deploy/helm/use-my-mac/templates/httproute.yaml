{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "umm.fullname" . }}
  labels: {{- include "umm.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    # Agents long-poll for up to 30s; keep the route timeout above that.
    - matches:
        - path: {type: PathPrefix, value: /v1/agent/}
      timeouts:
        request: 120s
      backendRefs:
        - name: {{ include "umm.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "umm.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
