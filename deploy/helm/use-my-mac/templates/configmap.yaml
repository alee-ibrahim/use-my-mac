apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "umm.fullname" . }}
  labels: {{- include "umm.labels" . | nindent 4 }}
data:
  server.yaml: |
    listen: ":8080"
    public_url: {{ .Values.publicURL | quote }}
    database: "sqlite:///data/umm.db"
    web_dir: /app/web
    storage:
      backend: {{ .Values.storage.backend }}
      local:
        dir: /data/blobs
      {{- if eq .Values.storage.backend "s3" }}
      s3:
        endpoint: {{ .Values.storage.s3.endpoint | quote }}
        region: {{ .Values.storage.s3.region | quote }}
        bucket: {{ .Values.storage.s3.bucket | quote }}
        prefix: {{ .Values.storage.s3.prefix | quote }}
        path_style: {{ .Values.storage.s3.pathStyle }}
      {{- end }}
    {{- if .Values.oidc.enabled }}
    oidc:
      preset: {{ .Values.oidc.preset | quote }}
      tenant_id: {{ .Values.oidc.tenantID | quote }}
      issuer: {{ .Values.oidc.issuer | quote }}
      client_id: {{ .Values.oidc.clientID | quote }}
      admin_groups: {{ .Values.oidc.adminGroups | toJson }}
      viewer_groups: {{ .Values.oidc.viewerGroups | toJson }}
      default_role: {{ .Values.oidc.defaultRole | quote }}
      domain_hint: {{ .Values.oidc.domainHint | default "" | quote }}
      prompt: {{ .Values.oidc.prompt | default "" | quote }}
    {{- end }}
    auth:
      dashboard_api_key_login: {{ .Values.auth.dashboardAPIKeyLogin | default "auto" | toString | quote }}
      auto_sign_in: {{ ne (toString .Values.auth.autoSignIn) "false" }}
    {{- with .Values.scheduler }}
    scheduler: {{- toYaml . | nindent 6 }}
    {{- end }}
