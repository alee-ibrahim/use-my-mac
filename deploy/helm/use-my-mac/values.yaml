image:
  repository: ghcr.io/alee-ibrahim/use-my-mac
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# The router keeps live agent state in memory: run exactly one replica.
replicaCount: 1

# How agents and browsers reach the router.
publicURL: https://umm.example.com

# Name of an existing Secret holding environment variables:
#   UMM_SECRET_KEY (required, >= 32 chars), and optionally UMM_DATABASE_URL,
#   UMM_OIDC_CLIENT_SECRET, UMM_S3_ACCESS_KEY, UMM_S3_SECRET_KEY,
#   UMM_BOOTSTRAP_ADMIN_KEY.
# Create it with your secret manager; the chart never renders secret values.
existingSecret: use-my-mac

database:
  # SQLite on the data volume by default. For an external Postgres put
  # UMM_DATABASE_URL (postgres://...) in existingSecret; it overrides SQLite.
  external: false

storage:
  backend: local # local | s3
  directDownloadTTLMinutes: 60 # s3: presigned download URLs for apps (max 10080)
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: umm/
    pathStyle: true

persistence:
  enabled: true # SQLite database and local blob storage
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteOnce

oidc:
  enabled: false
  preset: entra # Microsoft Entra ID preset; "" for any other OIDC provider
  tenantID: ""
  issuer: "" # required when preset is ""
  clientID: ""
  # Config rules: locked in the dashboard; admins add more under Settings > Access (stored in the database).
  adminGroups: []
  viewerGroups: []
  defaultRole: "" # "" = deny users no rule matches; "viewer" = read-only for everyone who can sign in
  domainHint: "" # sent as domain_hint on the authorize request
  prompt: "" # e.g. select_account

auth:
  # API-key sign-in to the dashboard: auto (on only without OIDC) | "true"
  # (break-glass alongside OIDC, at /login) | "false". Bearer API keys for the
  # REST API, CLI and apps always work.
  dashboardAPIKeyLogin: auto
  # With OIDC, send signed-out browsers straight to the provider.
  autoSignIn: true

# Extra scheduler settings merged into server.yaml (see deploy/server.example.yaml).
scheduler: {}

# Agent self-update relay (see docs/design.md "Agent self-update"). The router
# fetches signed agent releases from GitHub and caches them in its storage;
# set relay: false to make Macs download directly, or offline: true to serve
# only artifacts uploaded with PUT /v1/updates/artifacts/<version>/<file>.
updates: {}
#  relay: true
#  release_url: https://github.com/alee-ibrahim/use-my-mac/releases/download
#  offline: false

# One-line Mac install (dashboard: Macs > Add Mac > One command; see
# docs/usage.md "Add a Mac with one command"). Needs an https public URL.
# Without profiles, a "default" profile allowlists /opt/homebrew/bin/ffmpeg.
install: {}
#  service_label: com.example.helper   # neutral LaunchDaemon label
#  profiles:
#    default:
#      runtimes: {ffmpeg: ["/opt/homebrew/bin/ffmpeg"]}
#    lab:
#      labels: {site: lab}
#      runtimes: {ffmpeg: ["/opt/homebrew/bin/ffmpeg"], ocr: ["/usr/bin/python3", "/opt/ocr/run.py"]}
#      max_tasks: 2

# How long the router keeps metrics history, the activity log and finished
# jobs (see docs/design.md "Metrics history"). Admins can change it at runtime
# in Settings; that wins over these defaults.
retention: {}
#  jobs_days: 0              # delete finished jobs after N days; 0 = keep
#  events_days: 90
#  metrics_raw_hours: 24     # 1-minute resolution, 24..168
#  metrics_rollup_days: 30   # 15-minute resolution

service:
  type: ClusterIP
  port: 80

# Example Gateway API route. Agents reach /v1/agent/* on the same host as the
# dashboard and the app API.
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - umm.example.com

serviceMonitor:
  enabled: false
  interval: 30s
  # Extra labels, e.g. the label your Prometheus selects monitors by.
  labels: {}

# Annotations on the Deployment (e.g. for a tool that restarts it when its
# Secret changes) and on the pod template.
annotations: {}
podAnnotations: {}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
